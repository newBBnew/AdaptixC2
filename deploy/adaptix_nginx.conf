worker_processes  1;
events {
    worker_connections  1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    # 临时路径，避免 macOS 权限问题
    client_body_temp_path temp/client_body;
    proxy_temp_path       temp/proxy;
    fastcgi_temp_path     temp/fastcgi;
    uwsgi_temp_path       temp/uwsgi;
    scgi_temp_path        temp/scgi;

    sendfile        on;
    keepalive_timeout  65;

    server {
        listen 80;
        server_name localhost;
        
        # 强制重定向 HTTP 到 HTTPS
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl http2;
        server_name localhost;

        # SSL 证书路径 
        ssl_certificate     /Users/blackman/netattack/c2/adaptixC2_1.0/release/server.rsa.crt;
        ssl_certificate_key /Users/blackman/netattack/c2/adaptixC2_1.0/release/server.rsa.key;

        # SSL 优化配置
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;
        
        # 静态资源目录 (Web Client)
        root /Users/blackman/netattack/c2/adaptixC2_1.0/deploy/web_dist;
        index index.html;

        # 1. 静态资源路由
        location / {
            try_files $uri $uri/ /index.html;
        }

        # 2. API 反向代理
        location /api/ {
            # Rewrite /api/xxx to /xxx and forward to Teamserver
            rewrite ^/api/(.*) /$1 break;
            
            # 转发到本地 Teamserver
            proxy_pass https://127.0.0.1:4321;
            
            # 信任后端的自签名证书
            proxy_ssl_verify off;
            
            # WebSocket 支持 (关键)
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            
            # 传递客户端真实 IP
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        
        # 日志配置
        access_log /Users/blackman/netattack/c2/adaptixC2_1.0/deploy/access.log;
        error_log /Users/blackman/netattack/c2/adaptixC2_1.0/deploy/error.log;
    }
}
